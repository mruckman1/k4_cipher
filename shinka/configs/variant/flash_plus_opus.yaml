# @package _global_
# Balanced ensemble: Gemini 3.5 Flash (volume) + Claude Opus 4.7 (quality),
# BOTH routed via OpenRouter -- one API key, two model arms.
#
# Different model families means genuinely different mutation distributions.
# Opus 4.7's coding edge (87.6% SWE-Bench Verified) is precisely useful
# here because the mutation task is "modify cipher code to improve fitness,"
# which IS a SWE-Bench-domain task. Flash provides volume cheaply; Opus
# provides quality on harder mutations. UCB bandit selects between them
# based on which is producing higher-scoring proposals.
#
# Requires only:
#   OPENROUTER_API_KEY  (routes both Gemini 3.5 Flash and Claude Opus 4.7)
#
# Cost: roughly $30-50 per 250-generation run. Opus is ~6x Flash per
# token but the bandit only pulls it when its expected score gain
# justifies the cost (cost_aware_coef tuned for this).

defaults:
  - /evolution: default
  - /database: default
  - /runner: local
  - /evaluator: in_process
  - _self_

task_name: k4_flash_plus_opus
results_dir: results/${task_name}/${now:%Y-%m-%d_%H-%M-%S}

init_program_path: problem/initial.py

# Two arms across all four LM slots. Bandit selects per call.
llm_models:
  - openrouter/google/gemini-3.5-flash
  - openrouter/anthropic/claude-opus-4.7
prompt_llm_models:
  - openrouter/google/gemini-3.5-flash
  - openrouter/anthropic/claude-opus-4.7
meta_llm_models:
  - openrouter/google/gemini-3.5-flash
  - openrouter/anthropic/claude-opus-4.7
novelty_llm_models:
  - openrouter/google/gemini-3.5-flash

# Cost-aware UCB1 across the two arms. cost_aware_coef=0.5 means Flash
# (cheap) gets pulled when quality is comparable, Opus (expensive) gets
# pulled when it's distinctly producing better mutations. Tweak upward
# (0.7-1.0) if Opus is dominating spend without proportional fitness
# gains; tweak downward (0.3) if Opus is clearly the higher-leverage arm.
llm_dynamic_selection: ucb
llm_dynamic_selection_kwargs:
  cost_aware_coef: 0.5

llm_kwargs:
  temperatures: [0.3, 0.7, 1.0]
  max_tokens: 6144
  reasoning_efforts: ["minimal"]

num_generations: 250
max_api_costs: 50.0

benchmark_set: default
cascade_stages:
  - { name: smoke, instances: 1, timeout_s: 10, reject_if_solved_ratio_below: 0.0 }
  - { name: main,  instances: 1, timeout_s: 30, reject_if_solved_ratio_below: 0.0 }

seeds: [17, 42, 1337]
num_runs: 1

holdout_every_n_generations: 50
