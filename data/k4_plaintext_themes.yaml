# K4 plaintext-content inference (N1): clustered themes from 12 LM
# subagent runs producing 6 candidate 97-character plaintexts each.
# Total: 12 subagents x 6 candidates = 72 candidates.
# All cribs were enforced; 72/72 pass strict crib check.

convergence_statistic:
  description: |
    For each theme, the fraction of independent subagents (each
    with different framing/prompt) producing >=1 candidate
    containing that theme. High convergence = strong prior.

  navigation:
